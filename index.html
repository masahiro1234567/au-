<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>au navi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script>
    // 画面が開かないときの保険：読み込みの失敗を覚えておき、1回だけ最新のページを取り直す。
    // それでも開かなければ、原因の文字と「もう一度読み込む」を出す（スクショで原因が分かるように）
    (function () {
      var errs = [];
      window.__aunaviErrs = errs;
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) errs.push('読み込めませんでした：' + (t.src || t.href));
        else if (e && e.message) errs.push(e.message);
        if (t && t.tagName === 'SCRIPT' && !sessionStorage.getItem('js-retry')) {
          sessionStorage.setItem('js-retry', '1');
          location.replace(location.pathname + '?v=' + Date.now());
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) { errs.push(String(e && e.reason && (e.reason.message || e.reason))); });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.children.length) {
          root.innerHTML = '<div style="font-family:sans-serif;max-width:520px;margin:60px auto;padding:20px;color:#1a0f08">' +
            '<h2 style="color:#cc4f00">au navi を開けませんでした</h2>' +
            '<p>下の「もう一度読み込む」を押してください。直らないときは、この画面のスクショを管理者に送ってください。</p>' +
            '<pre style="white-space:pre-wrap;background:#fff3eb;padding:10px;border-radius:8px;font-size:12px">' + (errs.join('\n') || '原因が分かりませんでした') + '\n' + navigator.userAgent + '</pre>' +
            '<button onclick="sessionStorage.clear();location.replace(location.pathname+\'?v=\'+Date.now())" style="height:44px;padding:0 18px;border:none;border-radius:10px;background:#ff6600;color:#fff;font-weight:700">もう一度読み込む</button></div>';
        } else { sessionStorage.removeItem('js-retry'); }
      }, 12000);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
